<!DOCTYPE html>
<html lang="en" ng-app="siteApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <title>Subsidiaries - ACH Enrollment</title>
</head>
<body>
  <!-- Sidebar Drawer -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Keshav Prabhu</h2>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <ul class="sidebar-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="subsidiaries.html">Subsidiaries</a></li>
    </ul>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="navbar">
    <div class="nav-container">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="logo">Keshav Prabhu</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="subsidiaries.html">Subsidiaries</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </nav>

  <header class="hero hero-small">
    <div class="hero-content">
      <div class="hero-text">
        <h1>Subsidiary Enrollment</h1>
        <p class="tagline">Add or manage subsidiary ACH enrollment details</p>
      </div>
    </div>
  </header>

  <main class="container">
    <form id="subsidiaryForm" class="contact-form" novalidate>
      <section class="form-section">
        <h2>ACH Enrollment</h2>

        <div class="form-group">
          <label for="immediateOriginId">Immediate Origin ID</label>
          <input id="immediateOriginId" name="immediateOriginId" type="text" maxlength="10" required placeholder="Up to 10 characters">
        </div>

        <div class="form-group">
          <label for="companyId">Company ID</label>
          <input id="companyId" name="companyId" type="text" maxlength="10" required placeholder="Up to 10 characters">
        </div>

        <div class="form-group">
          <label for="onBehalf">On behalf of</label>
          <select id="onBehalf" name="onBehalf" required>
            <option value="self" selected>Self</option>
            <option value="other">Other</option>
          </select>
        </div>
      </section>

      <section id="subsidiaryDetailsSection" class="form-section">
        <h2>Subsidiary Details</h2>

        <div class="form-group">
          <label for="subsidiaryName">Subsidiary Name</label>
          <input id="subsidiaryName" name="subsidiaryName" type="text" required placeholder="Subsidiary Name">
        </div>

        <div class="form-group">
          <label for="address1">Address Line 1</label>
          <input id="address1" name="address1" type="text" required placeholder="Address line 1">
        </div>

        <div class="form-group">
          <label for="address2">Address Line 2</label>
          <input id="address2" name="address2" type="text" placeholder="Address line 2 (optional)">
        </div>

        <div class="form-row">
          <div class="form-group col-flex">
            <label for="city">City</label>
            <select id="city" name="city" required>
              <option value="">Select a city</option>
              <option>New York</option>
              <option>Los Angeles</option>
              <option>San Francisco</option>
              <option>Chicago</option>
              <option>Seattle</option>
            </select>
          </div>
          <div class="form-group col-140">
            <label for="state">State/Province</label>
            <select id="state" name="state" required>
              <option value="">Select</option>
              <option>NY</option>
              <option>CA</option>
              <option>CO</option>
              <option>WA</option>
              <option>IL</option>
            </select>
          </div>
          <div class="form-group col-160">
            <label for="postal">Postal Code</label>
            <input id="postal" name="postal" type="text" inputmode="numeric" pattern="\d{5}(-\d{4})?" placeholder="e.g. 94105" required>
          </div>
        </div>

        <div class="form-group">
          <label for="country">Country Code</label>
          <select id="country" name="country" required>
            <option value="US" selected>US</option>
            <option value="CA">CA</option>
            <option value="GB">GB</option>
            <option value="AU">AU</option>
          </select>
        </div>
      </section>

      <div class="buttons-row">
        <button type="button" id="addSubsidiary" class="btn btn-add">Add Another</button>
        <button type="submit" class="btn btn-primary">Submit Enrollment</button>
      </div>
      <div id="formMessage" class="msg" aria-live="polite"></div>
    </form>
    <section class="added-list">
      <h3>Added Subsidiaries</h3>
      <div id="subsidiaryList"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Keshav Prabhu. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="./scripts.js"></script>
</body>
</html>
